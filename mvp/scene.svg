<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Page background: an older adult at home (left), the gatekeeper on the home hub (middle), what leaves through the door (right).
       The x positions follow the three zone cards: home, gatekeeper, outside (the door sits where the outside card starts). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3eff9"/><stop offset="1" stop-color="#cfe3f6"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf1e2"/><stop offset="1" stop-color="#f6e6cf"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8aa0"/></marker>
  </defs>
  <rect width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1540" cy="60" r="34" fill="#f8d77a"/>
  <rect x="1200" y="480" width="400" height="80" fill="#d4e9c6"/>
  <!-- the house -->
  <rect x="930" y="120" width="56" height="90" fill="#b8664b"/>
  <rect x="0" y="232" width="1200" height="330" fill="url(#wall)"/>
  <polygon points="-40,244 600,108 1240,244" fill="#c9775a"/>
  <polygon points="40,234 600,128 1160,234" fill="#d98c6c"/>
  <rect x="0" y="480" width="1200" height="80" fill="#e8cfae"/>
  <line x1="0" y1="515" x2="1200" y2="515" stroke="#dcbf99" stroke-width="2"/>
  <!-- right wall with the open door -->
  <rect x="1188" y="232" width="24" height="330" fill="#b8664b"/>
  <rect x="1188" y="318" width="24" height="170" fill="#eef6fd"/>
  <polygon points="1212,318 1258,330 1258,478 1212,488" fill="#c98b62"/>
  <circle cx="1248" cy="405" r="4" fill="#8a5a3c"/>
  <!-- window -->
  <rect x="60" y="262" width="170" height="110" rx="6" fill="#cfe3f6" stroke="#c9a37e" stroke-width="7"/>
  <line x1="145" y1="262" x2="145" y2="372" stroke="#c9a37e" stroke-width="4"/>
  <!-- sofa and the older adult -->
  <rect x="50" y="410" width="240" height="70" rx="22" fill="#9db7c9"/>
  <rect x="40" y="390" width="36" height="100" rx="16" fill="#88a5b9"/>
  <rect x="264" y="390" width="36" height="100" rx="16" fill="#88a5b9"/>
  <rect x="130" y="350" width="90" height="90" rx="36" fill="#7d9a7e"/>
  <circle cx="175" cy="322" r="30" fill="#f1c9a5"/>
  <path d="M145 318c0-26 16-38 30-38s32 10 32 35c-7-12-18-16-32-16s-25 7-30 19z" fill="#e8e6e3"/>
  <circle cx="165" cy="324" r="3" fill="#5b4636"/><circle cx="185" cy="324" r="3" fill="#5b4636"/>
  <path d="M167 336q8 6 16 0" stroke="#5b4636" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="200" y="396" width="20" height="13" rx="4" fill="#3b3f46"/>
  <!-- what the person says -->
  <rect x="235" y="262" width="300" height="66" rx="16" fill="#ffffff" stroke="#c9a37e" stroke-width="2"/>
  <polygon points="250,326 266,326 214,312" fill="#ffffff" stroke="#c9a37e" stroke-width="2"/>
  <text x="252" y="289" font-size="16" fill="#5b4636">"Please call Dr. Okafor at</text>
  <text x="252" y="313" font-size="16" fill="#5b4636"><tspan fill="#c0532f" font-weight="700">814-555-0193</tspan>, I feel dizzy."</text>
  <!-- devices: speaker on a side table, wall camera -->
  <rect x="330" y="440" width="110" height="14" rx="4" fill="#b98a63"/>
  <rect x="342" y="454" width="9" height="30" fill="#a87a55"/><rect x="419" y="454" width="9" height="30" fill="#a87a55"/>
  <rect x="366" y="380" width="38" height="60" rx="15" fill="#4b5563"/>
  <circle cx="385" cy="398" r="5" fill="#9fd3c7"/>
  <g fill="none" stroke="#7aa9c9" stroke-width="3" stroke-linecap="round"><path d="M414 390q12 15 0 30"/><path d="M425 381q20 24 0 48"/></g>
  <rect x="560" y="262" width="50" height="28" rx="7" fill="#4b5563"/><circle cx="585" cy="276" r="8" fill="#9fd3c7"/>
  <!-- the gatekeeper: the home hub on a console -->
  <rect x="760" y="462" width="300" height="16" rx="5" fill="#b98a63"/>
  <rect x="780" y="478" width="11" height="10" fill="#a87a55"/><rect x="1029" y="478" width="11" height="10" fill="#a87a55"/>
  <rect x="820" y="362" width="180" height="100" rx="20" fill="#3b3f46"/>
  <path d="M910 375l36 14v26c0 24-17 37-36 44c-19-7-36-20-36-44v-26z" fill="#e9b949"/>
  <rect x="898" y="404" width="24" height="20" rx="4" fill="#3b3f46"/><path d="M903 404v-7a7 7 0 0 1 14 0v7" stroke="#3b3f46" stroke-width="4" fill="none"/>
  <circle cx="790" cy="340" r="17" fill="#e9b949"/><text x="790" y="346" font-size="17" font-weight="700" fill="#3b3f46" text-anchor="middle">2</text>
  <text x="815" y="346" font-size="17" font-weight="700" fill="#3b3f46">Gatekeeper on the home hub</text>
  <!-- flow: raw text in, masked text out -->
  <path d="M440 405 C560 395 700 400 815 410" stroke="#c0532f" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arr)"/>
  <rect x="560" y="364" width="140" height="28" rx="14" fill="#fbe0d6" stroke="#c0532f" stroke-width="1.5"/>
  <text x="630" y="384" font-size="14" fill="#c0532f" text-anchor="middle" font-weight="700">814-555-0193</text>
  <path d="M1005 412 C1090 412 1170 405 1290 400" stroke="#5f7f6a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arr)"/>
  <rect x="1040" y="366" width="116" height="28" rx="14" fill="#dff0e3" stroke="#5f7f6a" stroke-width="1.5"/>
  <text x="1098" y="386" font-size="14" fill="#3f6b4e" text-anchor="middle" font-weight="700">[MASKED]</text>
  <!-- outside: AI model, family, caregiver, blockchain -->
  <path d="M1270 132a38 38 0 0 1 36-46a52 52 0 0 1 98-6a36 36 0 0 1 38 52z" fill="#ffffff" stroke="#9bb8d3" stroke-width="2"/>
  <text x="1356" y="112" font-size="15" fill="#3d5a78" text-anchor="middle" font-weight="700">AI model</text>
  <text x="1356" y="152" font-size="12" fill="#3d5a78" text-anchor="middle">answers, no data kept</text>
  <rect x="1290" y="190" width="56" height="96" rx="10" fill="#3b3f46"/><rect x="1297" y="201" width="42" height="72" rx="4" fill="#fdecec"/>
  <path d="M1308 228a10 10 0 0 1 20 0v10l4 6h-28l4-6z" fill="#c0532f"/>
  <text x="1318" y="306" font-size="14" fill="#3d5a78" text-anchor="middle" font-weight="700">Family</text>
  <rect x="1440" y="214" width="104" height="72" fill="#ffffff" stroke="#9bb8d3" stroke-width="2"/>
  <polygon points="1430,216 1492,182 1554,216" fill="#9bb8d3"/>
  <rect x="1483" y="228" width="18" height="46" fill="#d9534f"/><rect x="1469" y="242" width="46" height="18" fill="#d9534f"/>
  <text x="1492" y="306" font-size="14" fill="#3d5a78" text-anchor="middle" font-weight="700">Caregiver</text>
  <g stroke="#7a8aa0" stroke-width="2" fill="none" stroke-dasharray="5 6">
    <path d="M1296 392 C1305 360 1315 340 1318 314"/>
    <path d="M1300 392 C1380 360 1460 340 1488 314"/>
    <path d="M1292 392 C1262 300 1290 200 1330 160"/>
    <path d="M1300 408 C1305 420 1310 425 1318 430"/>
  </g>
  <circle cx="1250" cy="290" r="17" fill="#5b8ec4"/><text x="1250" y="296" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <rect x="1300" y="430" width="68" height="46" rx="7" fill="#e9eef5" stroke="#5f6f86" stroke-width="2"/>
  <rect x="1392" y="430" width="68" height="46" rx="7" fill="#e9eef5" stroke="#5f6f86" stroke-width="2"/>
  <rect x="1484" y="430" width="68" height="46" rx="7" fill="#e9eef5" stroke="#5f6f86" stroke-width="2"/>
  <g stroke="#5f6f86" stroke-width="4" stroke-linecap="round"><line x1="1368" y1="453" x2="1392" y2="453"/><line x1="1460" y1="453" x2="1484" y2="453"/></g>
  <path d="M1504 453l10 10l20-20" stroke="#3f6b4e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="1426" y="500" font-size="14" fill="#3d5a78" text-anchor="middle" font-weight="700">Blockchain</text>
  <circle cx="40" cy="300" r="17" fill="#c9775a"/><text x="40" y="306" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
</svg>
